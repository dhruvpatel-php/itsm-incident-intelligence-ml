[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "prcl-0012-itsm-ml"
version = "1.0.0"
description = "ABC Tech ITSM Machine Learning Suite (ITIL Process Optimization)"
authors = [{ name = "Senior Data Scientist" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.28.0",
    "joblib>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".ipynb_checkpoints",
    "*.ipynb",
    "build_and_execute_v3.py"
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741", "E722", "E712", "E402", "W291", "W293", "E701"]
